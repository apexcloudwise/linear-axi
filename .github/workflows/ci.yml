name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-and-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run build:skill -- --check
      - run: pnpm test

  packed-tarball:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:skill

      - name: Produce npm tarball
        run: |
          npm pack
          echo "TARBALL=$(ls apexcloudwise-linear-axi-*.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Assert required tarball entries
        run: |
          tar tzf "$TARBALL" > /tmp/tarball-entries.txt
          echo "Tarball contents:"
          cat /tmp/tarball-entries.txt
          for required in "package.json" "dist/bin/linear-axi.js" "skills/linear-axi/SKILL.md" "README.md" "LICENSE"; do
            grep -q "^package/${required}$" /tmp/tarball-entries.txt || {
              echo "FAIL: missing required entry '${required}' in tarball"
              exit 1
            }
          done
          echo "All required tarball entries present."

      - name: Install tarball into clean prefix
        run: |
          mkdir -p /tmp/packed-install
          npm install --prefix /tmp/packed-install "$TARBALL"

      - name: Smoke-test installed binary
        run: |
          export PATH="/tmp/packed-install/node_modules/.bin:$PATH"
          PKG_VERSION=$(node -p "require('./package.json').version")
          INSTALLED_VERSION=$(linear-axi --version)
          echo "Package version: $PKG_VERSION"
          echo "Installed version: $INSTALLED_VERSION"
          [ "$INSTALLED_VERSION" = "$PKG_VERSION" ]
          linear-axi --help
