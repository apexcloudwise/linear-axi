name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run build:skill -- --check
      - run: pnpm test

  packed-tarball:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:skill

      - name: Produce npm tarball
        run: |
          npm pack
          echo "TARBALL=$(ls apexcloudwise-linear-axi-*.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Install tarball into clean prefix
        run: |
          mkdir -p /tmp/packed-install
          npm install --prefix /tmp/packed-install "$TARBALL"

      - name: Smoke-test installed binary
        run: |
          export PATH="/tmp/packed-install/node_modules/.bin:$PATH"
          PKG_VERSION=$(node -p "require('./package.json').version")
          INSTALLED_VERSION=$(linear-axi --version)
          echo "Package version: $PKG_VERSION"
          echo "Installed version: $INSTALLED_VERSION"
          [ "$INSTALLED_VERSION" = "$PKG_VERSION" ]
          linear-axi --help
