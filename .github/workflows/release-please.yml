name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Enforce npm minimum version
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: ${NPM_VERSION}"
          NPM_MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          NPM_MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          NPM_PATCH=$(echo "$NPM_VERSION" | cut -d. -f3)
          if [ "$NPM_MAJOR" -gt 11 ]; then
            true
          elif [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -gt 5 ]; then
            true
          elif [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -eq 5 ] && [ "$NPM_PATCH" -ge 1 ]; then
            true
          else
            echo "FAIL: npm >=11.5.1 required for trusted publishing --provenance (found ${NPM_VERSION})"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:skill

      - name: Assert release version integrity
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${RELEASE_VERSION}"
          echo "Package version: ${PKG_VERSION}"
          echo "Release version: ${RELEASE_VERSION}"
          echo "Release tag: ${RELEASE_TAG}"
          echo "Expected tag: ${EXPECTED_TAG}"
          [ "$PKG_VERSION" = "$RELEASE_VERSION" ] || { echo "FAIL: package version ${PKG_VERSION} != release version ${RELEASE_VERSION}"; exit 1; }
          [ "$RELEASE_TAG" = "$EXPECTED_TAG" ] || { echo "FAIL: tag ${RELEASE_TAG} != expected ${EXPECTED_TAG}"; exit 1; }

      - run: npm publish --provenance --access public
